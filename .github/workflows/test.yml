name: Test

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
        description: >-
          The workspace directory under `pkg/` to test. Scoped per package
          so that one package's failures cannot gate another's release —
          `@ghostry/extern` in particular must not be held back by a package
          that integrates a third-party library.
      build-run-id:
        required: true
        type: string
        description: The run ID of the build workflow that generated the artifacts to test.

jobs:
  test:
    name: Test
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      ##
      # Suites resolve their dependencies through built output rather than
      # source, so `@ghostry/extern`'s `dist` has to be in place for any
      # package's tests — its own included.
      #
      - name: Download `@ghostry/extern`
        uses: actions/download-artifact@v8
        with:
          name: pkg-extern
          path: pkg/extern/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build-run-id }}
          repository: ${{ github.repository }}

      - name: Download `@ghostry/${{ inputs.package }}`
        if: inputs.package != 'extern'
        uses: actions/download-artifact@v8
        with:
          name: pkg-${{ inputs.package }}
          path: pkg/${{ inputs.package }}/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.build-run-id }}
          repository: ${{ github.repository }}

      - name: Test
        run: bun --cwd=pkg/${{ inputs.package }} run test
